spring.application.name=assistant-doc-ia

# Base de donnees (PostgreSQL + pgvector, lancee via compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5433/assistantdoc
spring.datasource.username=assistantdoc
spring.datasource.password=assistantdoc

# Le schema est gere par Flyway, Hibernate se contente de le valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Demarre/arrete automatiquement le conteneur PostgreSQL avec l'application
spring.docker.compose.lifecycle-management=start-only

management.endpoints.web.exposure.include=health,info

# Import de fichiers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# OCR (Tesseract) : dossier des fichiers de langue et langues utilisées
app.ocr.data-path=${OCR_DATA_PATH:tessdata}
app.ocr.language=fra+eng

# RAG - modele d'embedding local (ONNX, multilingue, vecteurs de 384 dimensions)
# Telecharge au premier demarrage (~120 Mo) puis mis en cache sur le disque
app.embedding.model-base=https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/main
spring.ai.embedding.transformer.onnx.model-uri=${app.embedding.model-base}/onnx/model_quint8_avx2.onnx
spring.ai.embedding.transformer.tokenizer.uri=${app.embedding.model-base}/tokenizer.json
spring.ai.embedding.transformer.tokenizer.options.truncation=true
spring.ai.embedding.transformer.tokenizer.options.maxLength=256
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/assistant-doc-ia/onnx

# RAG - stockage des passages dans pgvector (table creee par Flyway V3, pas par Spring AI)
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=document_chunk
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# Secrets locaux (cle API) : fichier backend/.env, jamais commite
spring.config.import=optional:file:.env[.properties]

# Choix des modeles Spring AI : chat via l'API OpenAI-compatible, embeddings en local
spring.ai.model.chat=openai
spring.ai.model.embedding=transformers
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Chatbot - fournisseur d'IA (Groq par defaut, changeable sans toucher au code)
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${GROQ_API_KEY:cle-manquante}
spring.ai.openai.chat.model=${AI_CHAT_MODEL:openai/gpt-oss-120b}
# Faible temperature : reponses factuelles, peu d'invention
spring.ai.openai.chat.temperature=0.2

# RAG - nombre de passages envoyes au modele et score minimum de pertinence (0 a 1)
app.rag.top-k=5
app.rag.min-score=0.2

# Erreurs au format standard ProblemDetail (RFC 9457), y compris les erreurs de validation
spring.mvc.problemdetails.enabled=true

# Securite - jetons JWT (JWT_SECRET : au moins 32 caracteres ; sinon cle aleatoire a chaque demarrage)
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-validity=8h
# Comptes crees au premier demarrage (sinon mot de passe genere et affiche une fois dans les logs)
app.security.admin-password=${ADMIN_PASSWORD:}
app.security.user-password=${USER_PASSWORD:}
