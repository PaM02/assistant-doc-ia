<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/documents">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>
        </svg>
      </span>
      <span>
        <strong>Assistant documentaire</strong>
        <small>OCR · RAG</small>
      </span>
    </a>
    @if (auth.user(); as user) {
      <nav class="nav">
        <a routerLink="/documents" routerLinkActive="active">Documents</a>
        <a routerLink="/chat" routerLinkActive="active">Assistant</a>
      </nav>
      <div class="account">
        <span class="user" [title]="user.roles.join(', ')">
          {{ user.username }}
          <span class="role">{{ auth.isAdmin() ? 'Administrateur' : 'Lecture seule' }}</span>
        </span>
        <button class="btn btn-ghost" type="button" (click)="auth.logout()">Déconnexion</button>
      </div>
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
