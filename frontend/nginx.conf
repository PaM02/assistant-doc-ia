server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Appels de l'API transmis au backend (même origine : pas besoin de CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;     # même limite que le backend pour l'import
        proxy_read_timeout 180s;      # l'OCR d'un gros scan peut prendre du temps
    }

    # Fichiers JS/CSS avec empreinte dans le nom : mis en cache longtemps
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application Angular (routes côté navigateur) : toujours renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
