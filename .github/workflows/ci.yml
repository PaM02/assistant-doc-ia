name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un seul pipeline à la fois par branche : un nouveau push annule le précédent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Base utilisée par le test d'intégration (contexte Spring complet + migrations Flyway)
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: assistantdoc
          POSTGRES_USER: assistantdoc
          POSTGRES_PASSWORD: assistantdoc
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U assistantdoc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache du modèle d'embedding (~120 Mo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/assistant-doc-ia
          key: embedding-model-${{ hashFiles('backend/src/main/resources/application.properties') }}

      - name: Fichiers de langue Tesseract
        run: |
          mkdir -p tessdata
          for lang in fra eng; do
            curl -sSfL -o "tessdata/$lang.traineddata" "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
          done

      - name: Compilation et tests
        run: ./mvnw -B verify

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  docker:
    name: Docker (images + test de fumée)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Secrets de l'environnement de test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY:-absente}"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "USER_PASSWORD=$(openssl rand -hex 12)"
          } > backend/.env

      - name: Construction et démarrage de l'application
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Test de fumée (connexion, OCR, recherche, chatbot)
        run: |
          python3 scripts/smoke_test.py http://localhost:8090 admin \
            "$(sed -n 's/^ADMIN_PASSWORD=//p' backend/.env)" samples/procedure-panne-radio-scan.png

      - name: Logs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color

      - name: Publication des images sur GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in backend frontend; do
            for tag in latest "${GITHUB_SHA::7}"; do
              docker tag "assistant-doc-ia/$service:local" "ghcr.io/$owner/assistant-doc-ia-$service:$tag"
              docker push "ghcr.io/$owner/assistant-doc-ia-$service:$tag"
            done
          done

      - name: Arrêt
        if: always()
        run: docker compose down -v
